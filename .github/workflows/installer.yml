# =============================================================================
# ThorCash Installer Build — GitHub Actions
# =============================================================================
# Architecture:
#
#   test ───► build ───► release (tags only)
#
#   test:    mvn clean test
#   build:   package (mvn) + jlink (runtime) + jpackage (app-image)
#            + portable ZIP + Inno Setup wizard EXE
#   release: softprops/action-gh-release
#
# Key design decisions:
#
#   1. Explicit 'jlink' step creates the runtime, then jpackage receives it
#      via --runtime-image.  This avoids relying on jpackage's internal jlink
#      which (on some JDK versions) generates a runtime that lacks java.exe
#      and javaw.exe, causing "Failed to launch JVM".
#
#   2. JavaFX native DLLs are extracted from platform JARs into the input
#      directory so that -Djava.library.path=. resolves them directly at
#      startup.  JAVAFX_VERSION is a separate variable from APP_VERSION
#      because the project version differs from the JavaFX library version.
#
#   3. ONE jpackage app-image feeds both distribution artifacts: the portable
#      ZIP and the native setup wizard compiled by Inno Setup.  The wizard
#      gives end users the classic Windows flow (welcome -> EULA -> folder
#      picker -> progress -> Completed Setup screen with a launch checkbox).
#
#   4. Inno Setup 6 is preinstalled on GitHub windows-latest runners; a choco
#      fallback covers custom runners.
# =============================================================================

name: Build ThorCash Installer

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - quick

env:
  JAVA_VERSION: 26
  JAVA_DISTRIBUTION: temurin
  APP_NAME: ThorCash
  APP_VERSION: 1.0.14
  JAVAFX_VERSION: 21.0.6
  APP_VENDOR: Thor Technologies
  APP_MAIN_CLASS: com.schaccs.Launcher

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Job 1 — Run tests
  # ===========================================================================
  test:
    name: Run Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Run tests
        run: mvn clean test --batch-mode
        timeout-minutes: 30

  # ===========================================================================
  # Job 2 — Build setup wizard EXE and portable ZIP
  # ===========================================================================
  build:
    name: Build Installer
    needs: test
    runs-on: windows-latest
    outputs:
      exe_path: target\installer-output\ThorCash_Setup_v${{ env.APP_VERSION }}.exe
      zip_path: target\dist\${{ env.APP_NAME }}-Portable-${{ env.APP_VERSION }}.zip

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - name: Verify Inno Setup 6
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup 6 not preinstalled — installing via chocolatey"
            choco install innosetup --confirm --no-progress
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed" }
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          Write-Host "Inno Setup found: $iscc"
          & $iscc /?

      # ---- Step A: Package application JAR and copy dependencies -----------
      - name: Package application
        run: mvn package -DskipTests --batch-mode
        timeout-minutes: 15

      # ---- Step B: Prepare input directory for jpackage --------------------
      # jpackage --input copies everything here into the app image's app/
      - name: Prepare installer input
        shell: pwsh
        run: |
          $inputDir = "target\installer-input"
          Remove-Item -Recurse -Force $inputDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $inputDir | Out-Null

          # Copy main JAR
          Copy-Item "target\thorcash-$env:APP_VERSION.jar" "$inputDir\"

          # Copy dependency JARs (including JavaFX platform JARs)
          if (Test-Path "target\libs") {
            Copy-Item "target\libs\*" "$inputDir\"
          }

          # Extract JavaFX native DLLs from platform JARs
          # jpackage bundles these into app/ where -Djava.library.path=. finds them
          $repoRoot = (Get-Item $PWD).FullName
          & "$repoRoot\src\main\installer\extract-javafx-dlls.ps1" -OutputDir $inputDir

      # ---- Step C: Create runtime with explicit jlink ----------------------
      # This is the critical fix.  jpackage's internal jlink is unreliable —
      # it can produce a runtime missing java.exe/javaw.exe.
      # Explicit jlink always generates a complete runtime with both executables.
      - name: Create runtime with jlink
        shell: pwsh
        run: |
          $runtimeDir = "target\runtime"
          Remove-Item -Recurse -Force $runtimeDir -ErrorAction SilentlyContinue

          & "$env:JAVA_HOME\bin\jlink.exe" `
            --module-path "$env:JAVA_HOME\jmods" `
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.security.jgss,java.sql,java.xml,java.xml.crypto,jdk.jfr,jdk.unsupported,jdk.zipfs,jdk.crypto.cryptoki,jdk.crypto.ec,jdk.management,jdk.management.agent `
            --no-header-files --no-man-pages --strip-debug --compress=2 `
            --output $runtimeDir

          if (-not (Test-Path "$runtimeDir\bin\java.exe")) {
            throw "jlink runtime is missing java.exe"
          }
          if (-not (Test-Path "$runtimeDir\bin\javaw.exe")) {
            throw "jlink runtime is missing javaw.exe"
          }
          Write-Host "Runtime created: $( (Get-Item $runtimeDir).FullName )"

      # ---- Step D: Build self-contained app image --------------------------
      # Single source for both the portable ZIP and the Inno Setup wizard.
      - name: Build app image
        shell: pwsh
        run: |
          $appImageDir = "target\app-image"
          Remove-Item -Recurse -Force $appImageDir -ErrorAction SilentlyContinue

          & "$env:JAVA_HOME\bin\jpackage.exe" `
            --type app-image `
            --runtime-image "target\runtime" `
            --dest $appImageDir `
            --name "$env:APP_NAME" `
            --app-version "$env:APP_VERSION" `
            --input "target\installer-input" `
            --main-jar "thorcash-$env:APP_VERSION.jar" `
            --main-class "$env:APP_MAIN_CLASS" `
            --icon "src\main\resources\icon.ico" `
            --vendor "$env:APP_VENDOR" `
            --java-options "-Xmx512m" `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Djava.library.path=."

          if (-not (Test-Path "$appImageDir\$env:APP_NAME\$env:APP_NAME.exe")) {
            throw "App image not created"
          }
          Write-Host "App image created at $( (Get-Item $appImageDir).FullName )"

        timeout-minutes: 15

      # ---- Step E: Compile native setup wizard with Inno Setup -------------
      # Produces the classic Windows installer: welcome -> EULA -> folder
      # picker -> progress -> Completed Setup screen with launch checkbox.
      - name: Compile setup wizard
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target\installer-output" | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Q /DAppVersion=$env:APP_VERSION "installer.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

          $exe = "target\installer-output\ThorCash_Setup_v$env:APP_VERSION.exe"
          if (-not (Test-Path $exe)) { throw "Setup EXE not created at $exe" }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "Setup wizard created: $exe ($([math]::Round($size, 1)) MB)"

        timeout-minutes: 10

      # ---- Step F: Build portable ZIP --------------------------------------
      # The client's most reliable package: no installer, no admin rights,
      # no JVM requirement.
      - name: Build portable ZIP
        shell: pwsh
        run: |
          $distDir = "target\dist"
          New-Item -ItemType Directory -Force -Path $distDir | Out-Null
          $zipPath = "$distDir\$env:APP_NAME-Portable-$env:APP_VERSION.zip"
          Compress-Archive -Path "target\app-image\$env:APP_NAME\*" -DestinationPath $zipPath -Force
          $size = (Get-Item $zipPath).Length / 1MB
          Write-Host "ZIP created: $zipPath ($([math]::Round($size, 1)) MB)"

      # ---- Step G: Generate SHA-256 checksums ------------------------------
      - name: Generate checksums
        shell: pwsh
        run: |
          $exe = "target\installer-output\ThorCash_Setup_v$env:APP_VERSION.exe"
          $zip = "target\dist\$env:APP_NAME-Portable-$env:APP_VERSION.zip"

          $exeHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()

          Write-Host "EXE:  $exeHash"
          Write-Host "ZIP:  $zipHash"

          $exeHash | Out-File -FilePath "target\ThorCash_Setup_v$env:APP_VERSION.exe.sha256" -Encoding utf8
          $zipHash | Out-File -FilePath "target\$env:APP_NAME-Portable-$env:APP_VERSION.zip.sha256" -Encoding utf8

          @"
          $exeHash  ThorCash_Setup_v$env:APP_VERSION.exe
          $zipHash  $env:APP_NAME-Portable-$env:APP_VERSION.zip
          "@ | Out-File -FilePath "target\checksums.txt" -Encoding utf8

          Get-Content "target\checksums.txt"

      # ---- Step H: Upload artifacts ----------------------------------------
      - name: Upload setup wizard
        uses: actions/upload-artifact@v4
        with:
          name: ThorCash-Setup
          path: target\installer-output\ThorCash_Setup_v${{ env.APP_VERSION }}.exe
          retention-days: 90

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ThorCash-Portable
          path: target\dist\ThorCash-Portable-${{ env.APP_VERSION }}.zip
          retention-days: 90

      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: ThorCash-Checksums
          path: |
            target\checksums.txt
            target\*.sha256
          retention-days: 90

  # ===========================================================================
  # Job 3 — Create GitHub Release (tags only)
  # ===========================================================================
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Display artifacts
        run: ls -laR ThorCash-*/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ThorCash ${{ github.ref_name }}
          body: |
            ## ThorCash Financial System ${{ github.ref_name }}

            ### Downloads
            - **Windows Portable (ZIP)**: ThorCash-Portable-*.zip — No install, no admin rights, most reliable
            - **Windows Installer (EXE)**: ThorCash_Setup_v*.exe — Native setup wizard with desktop shortcut and launch-on-finish

            ### SHA-256 Checksums
            See `checksums.txt` attached to this release for file integrity verification.

            ### Installation
            1. Portable: unzip anywhere and double-click `ThorCash.exe` (no install).
            2. Or download `ThorCash_Setup_v*.exe`, run as Administrator, follow the
               wizard, and tick **Launch ThorCash** on the final screen.

            ### Silent Installation
            ```
            ThorCash_Setup_v*.exe /VERYSILENT /NORESTART
            ```
          files: |
            ThorCash-Setup/*.exe
            ThorCash-Setup/*.sha256
            ThorCash-Portable/*.zip
            ThorCash-Checksums/*.txt
            ThorCash-Checksums/*.sha256
          draft: false
          prerelease: false
